# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

services:
  proxy:
    image: traefik:v3.6
    command: --providers.docker
    ports:
      - 42069:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    container_name: big-dick-backend
    build: 
      context: .
      target: backend
    tty: true
    stdin_open: true
    develop:
      watch:
        - path: ./app/backend/src/
          target: /home/endowed-user/backend/src
          action: sync
        - path: ./app/backend/package.json
          action: rebuild
    labels:
      traefik.http.routers.backend.rule: Host(`localhost`) && PathPrefix(`/api`)
      traefik.http.services.backend.loadbalancer.server.port: 3000

  frontend:
    container_name: big-dick-frontend
    build:
      context: .
      target: frontend
    develop:
      watch:
        - path: ./app/frontend/src
          target: /home/endowed-user/frontend/src
          action: sync
        - path: ./app/frontend/package.json
          action: rebuild
    labels:
      traefik.http.routers.client.rule: Host(`localhost`)
      traefik.http.services.client.loadbalancer.server.port: 5173

